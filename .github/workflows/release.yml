name: Release

# Push a tag like "v0.2.0" to build meguru.koplugin.zip and attach it to a
# GitHub Release. `meguru/updater.lua` looks for an asset named exactly
# "meguru.koplugin.zip" on the *latest* release.
#
# The built asset is the one the updater downloads. There is no second,
# separately generated artifact anywhere in this flow -- an updater that fetches
# GitHub's own source archive by tag is a different file from the one CI built,
# and nothing reports it when the two disagree.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Both actions are on the majors that moved their runtime to Node 24.
      # Node 20 was deprecated on GitHub's runners in September 2025, and a step
      # left on it is forced onto 24 anyway — which is why the older majors keep
      # working and only warn, and why this is easy to leave alone until the day
      # it stops working. This checkout needs nothing from v5/v6/v7 beyond the
      # runtime move: no inputs, a tag, one commit.
      - name: Checkout
        uses: actions/checkout@v7

      # **A tag with a hyphen after the version is a development build** —
      # `v1.5.0-dev-derainbow-filter` — and the only thing that makes it one is
      # the prerelease flag this decides. It needs no other machinery:
      # `/releases/latest`, which `meguru/updater.lua` fetches, is documented as
      # "the most recent non-prerelease, non-draft release", so a prerelease is
      # invisible to every installed copy and nothing has to be told about it.
      #
      # The tag glob in `on.push.tags` matches both kinds, so this is the one
      # place they are told apart. It is deliberately here rather than beside
      # the release step: `_meta.lua`'s version has to carry the same suffix,
      # and the check below is where someone finds out they forgot.
      - name: Decide whether this tag is a prerelease
        id: kind
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Tag $GITHUB_REF_NAME -> prerelease=$prerelease"

      # A release whose _meta.lua disagrees with its tag is worse than no
      # release: the updater compares the tag against the *installed*
      # _meta.lua, so a stale version there makes every check report the new
      # release as "up to date" -- for good, and silently. This fails the whole
      # run rather than warning.
      - name: Check that _meta.lua version matches the tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          meta_version=$(grep -oP 'version\s*=\s*"\K[^"]+' _meta.lua)
          echo "Tag version:       $tag_version"
          echo "_meta.lua version: $meta_version"
          if [ -z "$meta_version" ]; then
            echo "::error::_meta.lua has no version field. The updater reads it as the installed version and cannot compare without it."
            exit 1
          fi
          if [ "$tag_version" != "$meta_version" ]; then
            echo "::error::Tag ($tag_version) does not match _meta.lua version ($meta_version). Bump _meta.lua's version field before tagging, or the updater will keep reporting this release as 'up to date' forever."
            exit 1
          fi

      # The repository root *is* the plugin, so the archive has to be staged to
      # get a top-level `meguru.koplugin/` -- the updater extracts into the
      # plugins directory and expects to find the folder inside. Staging is
      # also what keeps the developer material out: zipping the root would ship
      # CLAUDE.md (160 KB), PROTOCOL.md, tools/ and docs/ to every device.
      #
      # `assets/` must be in here -- meguru/rowcover reads the series-row
      # artwork through Paths.asset. LICENSE is in here because the zip is a
      # distribution of AGPL-licensed code.
      #
      # `libs/` too: it is the vendored moiré filter (meguru/derainbow loads it
      # through Paths.lib), and shipping it is the whole reason the Derainbow
      # row no longer needs derainbowify.koplugin installed. Its own LICENSE
      # travels inside that directory -- GPL-3.0 terms for GPL-3.0 binaries,
      # which is not the same file as the AGPL one at the root.
      - name: Build plugin zip
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/meguru.koplugin"
          cp -r _meta.lua main.lua LICENSE libs assets meguru "$stage/meguru.koplugin/"
          cd "$stage"
          zip -r "$GITHUB_WORKSPACE/meguru.koplugin.zip" meguru.koplugin \
            -x "*.git*" -x "*/.DS_Store"
          unzip -l "$GITHUB_WORKSPACE/meguru.koplugin.zip"

      - name: Create release
        # v3 is only the Node 24 runtime move; `files` and
        # `generate_release_notes` mean the same thing they did on v2.
        uses: softprops/action-gh-release@v3
        with:
          # The asset name must stay exactly this: it is hardcoded as
          # ASSET_NAME in meguru/updater.lua, and the updater finds the release
          # asset by name rather than by position.
          #
          # **A real release must never be marked here, and a development one
          # must always be.** `/releases/latest` returns the newest
          # non-prerelease release, so flipping this the wrong way is silent in
          # both directions: a prerelease real release would make the updater
          # see the *previous* one forever, and a non-prerelease development
          # build would be offered to every installed copy. The tag decides it
          # (`Decide whether this tag is a prerelease` above), so no one has to
          # remember which kind they are publishing.
          prerelease: ${{ steps.kind.outputs.prerelease }}
          files: meguru.koplugin.zip
          generate_release_notes: true
